<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认人物与发布 · ChillTong</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="workflow.css"></head><body><main><div class="eyebrow">CHILLTONG / PODCAST → BLOG</div><h1>确认每个人，整理每句话。</h1><p>确认人物 → 校对文字 → 预览并发布。未确认的稿件不会上传。</p><p id="status" role="status"></p><section><h2>01 · 谁在说话</h2><p class="hint">通过代表片段确认姓名或明确的角色称呼。编号只对应这次识别，不代表真实身份；重新识别音频后需要重新确认。</p><label for="sample-audio">选择原始音频，直接试听代表片段（可选）</label><input id="sample-audio" type="file" accept="audio/*,.webm"><audio id="player" controls></audio><div id="identities"></div></section><section><h2>02 · 校对与整理</h2><p id="unresolved" class="hint"></p><button id="save" class="secondary">保存人物与当前校对</button><div id="review-rows"></div><button id="more" class="secondary" hidden>保存并加载更多</button></section><section><h2>03 · 发布到 Blog</h2><label for="title">文章标题</label><input id="title"><label for="category">Blog 分类</label><select id="category"><option value="linux">技术与工程</option><option value="stoic">思考与复盘</option><option value="chill">生活与随笔</option></select><label for="description">列表摘要</label><textarea id="description" rows="2"></textarea><label for="introduction">整理说明与复习笔记</label><textarea id="introduction" rows="4" placeholder="写下这期播客的主题、收获，以及文字稿覆盖的范围"></textarea><label class="switch"><input type="checkbox" id="reviewed">我已校对收录的文字和人物归属，确认这些内容可以发布</label><div class="actions"><button id="check-connection" class="secondary">检查发布连接</button><button id="preview">保存并生成 HTML 预览</button><button id="publish" disabled>发布当前预览到 your Blog</button></div><p id="preview-info" class="hint"></p><iframe id="preview-frame" title="待发布文章预览" sandbox="allow-popups" hidden></iframe><p id="published" role="status"></p></section></main><dialog id="split"><form method="dialog"><h2>拆分多人发言</h2><p class="hint">手动填写两段文字，避免把一句中的多个人归给同一个人。原片段保留在本地编辑历史里。</p><label for="split-time">分界时间（视频秒数）</label><input id="split-time" type="number" step="0.01"><div class="split-grid"><div><h3>前半段</h3><select id="split-speaker-0" aria-label="前半段人物"></select><textarea id="split-en-0" aria-label="前半段英文" rows="4"></textarea><textarea id="split-zh-0" aria-label="前半段中文" rows="4"></textarea></div><div><h3>后半段</h3><select id="split-speaker-1" aria-label="后半段人物"></select><textarea id="split-en-1" aria-label="后半段英文" rows="4"></textarea><textarea id="split-zh-1" aria-label="后半段中文" rows="4"></textarea></div></div><p id="split-error" role="status"></p><div class="actions"><button value="cancel" class="secondary">取消</button><button type="button" id="save-split">保存拆分</button></div></form></dialog><script type="module" src="workflow.js"></script></body></html>
